# nginx перед php-fpm. Контейнер nginx стоит за внешним reverse-proxy (Caddy, см. deploy/edge),
# который терминирует TLS и передаёт X-Forwarded-Proto / X-Forwarded-For.

# Если прокси сообщил, что исходный запрос был по https — сообщаем это PHP,
# иначе Symfony будет генерировать http-ссылки и не ставить secure-cookie.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https   "on";
}

server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 20m;

    # Реальный IP клиента из заголовка прокси (только из docker-сетей)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Проверка живости самого nginx (используется healthcheck'ом и деплоем)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Собранная статика Webpack Encore — версионированные имена, можно кэшировать надолго
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        internal;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $fastcgi_https;

        # формирование реестров может быть долгим
        fastcgi_read_timeout 600;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Любые другие .php — 404
    location ~ \.php$ {
        return 404;
    }
}
