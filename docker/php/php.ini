; Продакшн-настройки PHP для reconciliation.
; Всё, что не указано, берётся из значений по умолчанию PHP.

[PHP]
expose_php = Off
short_open_tag = Off

memory_limit = 3G
max_execution_time = 120
max_input_time = 120
post_max_size = 20M
upload_max_filesize = 20M
max_file_uploads = 20

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On

default_socket_timeout = 60
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = Europe/Moscow

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1
session.gc_maxlifetime = 1440

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Образ неизменяемый: код не меняется без пересборки, проверять mtime файлов не нужно.
; Для локальной разработки это переопределяется в docker/php/conf.d/ (см. compose.yaml).
opcache.validate_timestamps = 0

[apcu]
apc.enable_cli = 1
