[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; Мастер-процесс запускается от root (нужно для инициализации /registry),
; рабочие процессы работают от www-data.
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Долгие операции (формирование реестров) — nginx ждёт до 600 с, см. docker/nginx/default.conf
request_terminate_timeout = 600

access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
